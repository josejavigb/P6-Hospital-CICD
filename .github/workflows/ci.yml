name: CI - Compile, Test & Coverage

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Give permissions to mvnw
        run: chmod +x ./mvnw

      - name: Compile
        run: ./mvnw compile --no-transfer-progress

      - name: Run integration tests
        run: ./mvnw verify --no-transfer-progress

      - name: Publish test report
        if: always()
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './target/*-reports/*.xml'
          github-report: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Jacoco badge
        id: jacoco
        if: always()
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true
          generate-summary: true
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: .github/badges

      - name: Log coverage percentage
        run: |
          echo "coverage = ${{ steps.jacoco.outputs.coverage }}"
          echo "branch coverage = ${{ steps.jacoco.outputs.branches }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Upload Jacoco report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Commit badge to repo
        if: github.event_name == 'push'
        uses: EndBug/add-and-commit@v9
        with:
          add: '.github/badges'
          message: 'Update coverage badges'
